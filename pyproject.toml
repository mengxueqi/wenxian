[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-tracker"
version = "0.1.0"
description = "Literature tracking pipeline for configured journal sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "feedparser>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.44,<2"]

[project.scripts]
literature-tracker = "literature_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["literature_tracker*"]

